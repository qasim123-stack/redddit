version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: reddit-postgres
    restart: always

    environment:
      POSTGRES_DB: reddit-database
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: qasim123

    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    
  redis:
    image: redis:7-alpine
    container_name: reddit-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  mongodb:
    image: mongo:7
    container_name: mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: rootpassword
    volumes:
      - mongo_data:/data/db
    restart: always

   



volumes:
  postgres_data:
  redis_data:
  mongo_data:
